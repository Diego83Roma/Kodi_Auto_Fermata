android {
    namespace = 'me.aap.kodiauto'
    defaultConfig {
        applicationId 'me.aap.kodiauto'
        versionCode 1
        versionName '1.0'
    }
    flavorDimensions += "version"
    productFlavors {
        auto { dimension "version" }
    }
    signingConfigs {
        release {
            storeFile file(localProps["storeFile"])
            storePassword localProps["storePassword"]
            keyAlias localProps["keyAlias"]
            keyPassword localProps["keyPassword"]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix '.debug' }
    }
}
dependencies {
    implementation libs.androidxMedia
    implementation libs.androidxCore
    implementation libs.media3Exoplayer
}