name: Build complete Kodi Auto Fermata APK

on:
  workflow_dispatch:
  push:
    branches:
      - fermata-base
    paths:
      - 'fermata/**'
      - 'modules/**'
      - 'depends/**'
      - '*.gradle'
      - 'gradle/**'
      - 'settings.gradle'
      - '.github/workflows/build-fermata-base.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: '1'
    steps:
      - name: Checkout Fermata base
        uses: actions/checkout@v4
        with:
          ref: fermata-base
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Check Fermata feature modules
        run: |
          set -euo pipefail
          echo "Moduli presenti nel sorgente:"
          find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          COUNT="$(find modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$COUNT" -ge 10
          echo "Trovate $COUNT directory di moduli; gdrive resta escluso perché NO_GS=1."

      - name: Build signed Android App Bundle with feature modules
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace bundleAutoRelease -PAPP_ID_SFX=.kodiauto
          AAB="$(find fermata/build/outputs/bundle/autoRelease -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          echo "Bundle generato: $AAB"
          ls -lh "$AAB"
          echo "Moduli inclusi nel bundle:"
          unzip -Z1 "$AAB" | awk -F/ '$2 == "manifest" {print $1}' | sort -u

      - name: Create one installable universal APK
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION="1.18.3"
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/kodiauto-universal.apks" \
            --mode=universal \
            --ks=res/fermata.jks \
            --ks-key-alias=fermata \
            --ks-pass=pass:fermata \
            --key-pass=pass:fermata
          unzip -p "$RUNNER_TEMP/kodiauto-universal.apks" universal.apk > "$RUNNER_TEMP/Kodi-Auto-Fermata-universal.apk"
          test -s "$RUNNER_TEMP/Kodi-Auto-Fermata-universal.apk"
          APK_SIZE="$(stat -c%s "$RUNNER_TEMP/Kodi-Auto-Fermata-universal.apk")"
          echo "Dimensione APK universale: $APK_SIZE byte"
          test "$APK_SIZE" -gt 20000000

      - name: Verify package, app label and signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Kodi-Auto-Fermata-universal.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='me.aap.fermata.auto.kodiauto'"
          echo "$BADGING" | grep -F "application-label:'Kodi Auto Fermata'"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK universale verificato: package separato, label corretta e firma valida."

      - name: Upload installable APK and diagnostic bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-auto-fermata-universal
          path: |
            ${{ runner.temp }}/Kodi-Auto-Fermata-universal.apk
            ${{ runner.temp }}/kodiauto-universal.apks
            ${{ env.AAB }}
          if-no-files-found: error
          retention-days: 14
