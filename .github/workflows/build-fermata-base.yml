name: Build Kodi Auto Fermata Modern TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - kodi-auto-fermata-modern-ui
    paths:
      - 'fermata/**'
      - 'modules/**'
      - 'depends/**'
      - '*.gradle'
      - 'gradle/**'
      - 'settings.gradle'
      - '.github/workflows/build-fermata-base.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: '1'
    steps:
      - name: Checkout Fermata base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Check Fermata feature modules
        run: |
          set -euo pipefail
          echo "Moduli presenti nel sorgente:"
          find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          COUNT="$(find modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$COUNT" -ge 10
          echo "Trovate $COUNT directory di moduli; gdrive resta escluso perché NO_GS=1."

      - name: Build signed modern TEST APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleAutoRelease -PAPP_ID_SFX=.kodiautomodern -PAPP_NAME="Kodi Auto Fermata TEST" -PABI=arm64-v8a -PNO_GS=true
          APK="$(find fermata/build/outputs/apk/auto/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          APK="$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Verify package, app label and signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='me.aap.fermata.auto.kodiautomodern'"
          echo "$BADGING" | grep -F "application-label:'Kodi Auto Fermata TEST'"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK universale verificato: package separato, label corretta e firma valida."

      - name: Upload installable APK and diagnostic bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-auto-fermata-modern-test
          path: ${{ runner.temp }}/Kodi-Auto-Fermata-Modern-TEST.apk
          if-no-files-found: error
          retention-days: 14
