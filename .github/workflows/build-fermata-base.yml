name: Build Fermata Android Auto base

on:
  workflow_dispatch:
  push:
    branches:
      - fermata-base
    paths:
      - 'fermata/**'
      - 'modules/**'
      - 'depends/**'
      - '*.gradle'
      - 'gradle/**'
      - 'settings.gradle'
      - '.github/workflows/build-fermata-base.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NO_GS: '1'
    steps:
      - name: Checkout Fermata base
        uses: actions/checkout@v4
        with:
          ref: fermata-base
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-36'

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build Android Auto release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleAutoRelease -PAPP_ID_SFX=.kodiauto

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fermata-auto-base
          path: fermata/build/outputs/apk/auto/release/*.apk
          if-no-files-found: error
          retention-days: 14
