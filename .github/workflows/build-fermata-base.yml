name: Build Kodi Auto Fermata Modern TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - kodi-auto-fermata-modern-ui
      - kodi-auto-fermata-modern-integration
      - kodi-auto-fermata-zip-import-test
      - kodi-auto-fermata-shared-zip-folder
      - kodi-auto-fermata-addon-library
      - kodi-auto-fermata-addon-screen-engine
    paths:
      - 'fermata/**'
      - 'modules/**'
      - 'depends/**'
      - '*.gradle'
      - 'gradle/**'
      - 'settings.gradle'
      - '.github/workflows/build-fermata-base.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: '1'
    steps:
      - name: Checkout Fermata base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Check Fermata feature modules
        run: |
          set -euo pipefail
          echo "Moduli presenti nel sorgente:"
          find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          COUNT="$(find modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$COUNT" -ge 10
          echo "Trovate $COUNT directory di moduli; gdrive resta escluso perché NO_GS=1."

      - name: Verify add-on library and private source browser integration
        run: |
          set -euo pipefail
          test -s fermata/src/main/java/me/aap/fermata/ui/activity/AddonLibraryActivity.java
          test -s fermata/src/main/java/me/aap/fermata/ui/activity/SourceBrowserActivity.java
          grep -q 'archiveOriginalPackage(uri, id, version)' fermata/src/main/java/me/aap/fermata/ui/activity/HomeActivity.java
          grep -q 'SourceBrowserActivity' fermata/src/main/AndroidManifest.xml
          grep -q 'AddonLibraryActivity' fermata/src/main/AndroidManifest.xml
          echo "Schermata add-on, download ZIP privato e apertura Kodi separata presenti."

      - name: Build modern TEST Android App Bundle
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace bundleAutoRelease -PAPP_ID_SFX=.kodiautomodern -PAPP_NAME="Kodi Auto Fermata TEST" -PABI=arm64-v8a -PNO_GS=true
          AAB="$(find fermata/build/outputs/bundle/autoRelease -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          ls -lh "$AAB"

      - name: Create signed universal TEST APK
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION="1.18.3"
          curl --fail --location --retry 3 "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/kodiauto-modern.apks" --mode=universal --ks=res/fermata.jks --ks-key-alias=fermata --ks-pass=pass:fermata --key-pass=pass:fermata
          unzip -p "$RUNNER_TEMP/kodiauto-modern.apks" universal.apk > "$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          test -s "$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          ls -lh "$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"

      - name: Verify package, app label and signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Kodi-Auto-Fermata-Modern-TEST.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='me.aap.fermata.auto.kodiautomodern'"
          echo "$BADGING" | grep -F "application-label:'Kodi Auto Fermata TEST'"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK universale verificato: package separato, label corretta e firma valida."

      - name: Upload installable APK and diagnostic bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-auto-fermata-modern-test
          path: ${{ runner.temp }}/Kodi-Auto-Fermata-Modern-TEST.apk
          if-no-files-found: error
          retention-days: 14
