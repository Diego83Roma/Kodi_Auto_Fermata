name: Build Kodi Auto Fermata Embedded Engine TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - kodi-auto-fermata-embedded-engine
    paths:
      - 'fermata/**'
      - 'modules/**'
      - 'depends/**'
      - '*.gradle'
      - 'gradle/**'
      - 'settings.gradle'
      - '.github/workflows/build-embedded-engine.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NO_GS: '1'
    steps:
      - name: Checkout isolated engine branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ] && [ "$LICENSE_STATUS" -ne 141 ]; then exit "$LICENSE_STATUS"; fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "ndk;29.0.14206865"

      - name: Download the verified upstream Kodi ARM64 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="14047181730"
          mkdir -p "$RUNNER_TEMP/kodi-payload"
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Diego83Roma/Kodi_Auto_Fermata/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/kodi-core-payload.zip"
          unzip -q "$RUNNER_TEMP/kodi-core-payload.zip" -d "$RUNNER_TEMP/kodi-payload"
          PAYLOAD="$RUNNER_TEMP/kodi-payload/kodi-core-payload"
          test -s "$PAYLOAD/lib/arm64-v8a/libkodi.so"
          test -s "$PAYLOAD/assets/system/addon-manifest.xml"
          mkdir -p fermata/src/main/jniLibs/arm64-v8a fermata/src/main/assets/kodi_engine
          cp -a "$PAYLOAD/lib/arm64-v8a/." fermata/src/main/jniLibs/arm64-v8a/
          cp -a "$PAYLOAD/assets/." fermata/src/main/assets/kodi_engine/
          echo "Kodi native libraries: $(find fermata/src/main/jniLibs/arm64-v8a -maxdepth 1 -name '*.so' | wc -l)"
          echo "Kodi runtime assets: $(find fermata/src/main/assets/kodi_engine -type f | wc -l)"
          du -sh fermata/src/main/jniLibs/arm64-v8a fermata/src/main/assets/kodi_engine

      - name: Verify embedded payload and isolated host
        run: |
          set -euo pipefail
          test -s fermata/src/main/jniLibs/arm64-v8a/libkodi.so
          test -s fermata/src/main/assets/kodi_engine/system/addon-manifest.xml
          test -s fermata/src/main/java/me/aap/fermata/ui/activity/KodiAddonEngineService.java
          test -s fermata/src/main/java/org/xbmc/kodi/Main.java
          test -s fermata/src/main/java/org/xbmc/kodi/XBMCMainView.java
          test -s fermata/src/main/java/org/xbmc/kodi/XBMCSettingsContentObserver.java
          test -s fermata/src/main/java/org/xbmc/kodi/XBMCInputDeviceListener.java
          grep -q 'android:name="org.xbmc.kodi.Main"' fermata/src/main/AndroidManifest.xml
          grep -q 'android:value="kodi"' fermata/src/main/AndroidManifest.xml
          grep -q 'android:process=":kodi_addon_engine"' fermata/src/main/AndroidManifest.xml
          grep -q 'android:process=":kodi_addon_engine"' fermata/src/main/AndroidManifest.xml
          grep -q 'Avvia motore add-on interno' fermata/src/main/java/me/aap/fermata/ui/activity/AddonLibraryActivity.java
          ! grep -q 'org.xbmc.kodi' fermata/src/main/java/me/aap/fermata/ui/activity/AddonLibraryActivity.java
          echo "Kodi ARM64 payload + NativeActivity JNI host + surface/settings/input bridges verified."

      - name: Build modern TEST Android App Bundle
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace bundleAutoRelease -PAPP_ID_SFX=.kodiautomodern -PAPP_NAME="Kodi Auto Fermata TEST" -PABI=arm64-v8a -PNO_GS=true
          AAB="$(find fermata/build/outputs/bundle/autoRelease -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          ls -lh "$AAB"

      - name: Create signed universal TEST APK
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION="1.18.3"
          curl --fail --location --retry 3 "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/kodiauto-modern.apks" --mode=universal --ks=res/fermata.jks --ks-key-alias=fermata --ks-pass=pass:fermata --key-pass=pass:fermata
          unzip -p "$RUNNER_TEMP/kodiauto-modern.apks" universal.apk > "$RUNNER_TEMP/Kodi-Auto-Fermata-Embedded-Engine-TEST.apk"
          test -s "$RUNNER_TEMP/Kodi-Auto-Fermata-Embedded-Engine-TEST.apk"
          ls -lh "$RUNNER_TEMP/Kodi-Auto-Fermata-Embedded-Engine-TEST.apk"

      - name: Verify package, native core and signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/Kodi-Auto-Fermata-Embedded-Engine-TEST.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='me.aap.fermata.auto.kodiautomodern'"
          echo "$BADGING" | grep -F "application-label:'Kodi Auto Fermata TEST'"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libkodi.so|assets/kodi_engine/system/addon-manifest.xml'
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload installable TEST APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-auto-fermata-embedded-engine-test
          path: ${{ runner.temp }}/Kodi-Auto-Fermata-Embedded-Engine-TEST.apk
          if-no-files-found: error
          retention-days: 14
