name: Build Kodi Auto Fermata — Kodi ARM64 integration stage

on:
  push:
    branches:
      - kodi-single-apk-integration-01
    paths:
      - 'kodi'
      - 'tools/build-kodi-android.sh'
      - '.github/workflows/build-kodi-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kodi-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository and pinned Kodi source
        uses: actions/checkout@v5
        with:
          ref: kodi-single-apk-integration-01
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint build-essential cmake curl             default-jdk flex gawk gcc g++ git gperf libasound2-dev libass-dev             libavahi-client-dev libavahi-common-dev libbluetooth-dev libbluray-dev             libcap-dev libcdio-dev libcurl4-openssl-dev libdrm-dev libegl1-mesa-dev             libflac-dev libfmt-dev libfontconfig1-dev libfreetype6-dev libfribidi-dev             libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev libgnutls28-dev             libinput-dev libltdl-dev liblzo2-dev libmicrohttpd-dev libmysqlclient-dev             libnfs-dev libogg-dev libpcre2-dev libplist-dev libpulse-dev libshairplay-dev             libsmbclient-dev libspdlog-dev libsqlite3-dev libssl-dev libtag1-dev             libtinyxml-dev libtool libudev-dev libva-dev libvdpau-dev libvorbis-dev             libxkbcommon-dev libxml2-dev libxrandr-dev libxslt1-dev libzstd-dev             unzip zip zlib1g-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and Kodi NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Prepare Android debug signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build pinned Kodi ARM64 and package engine validation APK
        run: |
          set -euo pipefail
          chmod +x tools/build-kodi-android.sh
          KODI_BUILD_JOBS=4 ./tools/build-kodi-android.sh

      - name: Verify generated Kodi package
        run: |
          set -euo pipefail
          APK="$(find kodi -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "Kodi engine validation APK: $APK"
          ls -lh "$APK"

      - name: Upload Kodi Auto Fermata Kodi engine stage
        uses: actions/upload-artifact@v4
        with:
          name: kodi-auto-fermata-kodi-engine-stage
          path: kodi/*.apk
          if-no-files-found: error
          if-no-files-found: error
          retention-days: 14
